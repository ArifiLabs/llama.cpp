# ArifiLabs backend compile matrix.
#
# Why this exists, and why it does not replace any upstream workflow.
#
# The ArifiLabs rig is a single Radeon 780M box: it compiles CPU, Vulkan, src/,
# common/ and tools/ and NOTHING else. CUDA, Metal, SYCL, HIP, OpenCL and WebGPU
# have no toolchain here, so every fork change on those backends has historically
# been unverifiable — which is how a half-applied merge left the Metal tree with
# five missing function definitions and no one noticed (lane-210).
#
# Upstream's own workflows (build-cuda-ubuntu.yml, build-apple.yml, build-sycl.yml,
# build-vulkan.yml) are kept and still run. They do NOT close this gap, because
# GGML_ARIFI_ROCMFPX_FORMATS and GGML_ARIFI_TURBO_WEIGHT_QUANTS both default to OFF
# (ggml/CMakeLists.txt:144,151) — upstream's matrix compiles the fork with every
# ArifiLabs weight format switched off. This workflow turns them ON, so the code
# that actually differentiates this fork is the code being compiled.
#
# Scope: COMPILE + LINK only, plus test-quantize-fns, which is a pure-CPU
# correctness test and runs on every job. GitHub runners have no NVIDIA, Apple or
# Intel GPU, so nothing here executes a GPU kernel and nothing here is a benchmark.
# A green run means "compile-verified, not benched" and must be reported that way.
#
# test-quantize-fns is BASELINED, not required to exit 0: it exits 1 on this fork
# because six ROCmFPX rows fail, and those six are pre-existing (the rig's own
# receipt on the same base reports them line for line). The step passes on zero
# failures or on exactly those six, and fails on anything else. It does NOT pipe
# straight into tee - that would take tee's exit status and the step could never
# fail at all.

name: CI (ArifiLabs backends matrix)

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - 'arifi/**'
      - 'lane-*/**'
    paths:
      - '.github/workflows/arifi-backends-matrix.yml'
      - 'ggml/**'
      - 'src/**'
      - 'common/**'
      - '**/CMakeLists.txt'
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - '.github/workflows/arifi-backends-matrix.yml'
      - 'ggml/src/ggml-cuda/**'
      - 'ggml/src/ggml-metal/**'
      - 'ggml/src/ggml-sycl/**'
      - 'ggml/src/ggml-vulkan/**'

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref && github.ref || github.run_id }}
  cancel-in-progress: true

env:
  # every job compiles the ArifiLabs weight formats; see the header note
  ARIFI_CMAKE_COMMON: >-
    -DCMAKE_BUILD_TYPE=Release
    -DGGML_NATIVE=OFF
    -DGGML_ARIFI_ROCMFPX_FORMATS=ON
    -DGGML_ARIFI_TURBO_WEIGHT_QUANTS=ON
    -DLLAMA_BUILD_EXAMPLES=OFF
    -DLLAMA_BUILD_TOOLS=OFF
    -DLLAMA_BUILD_TESTS=ON

jobs:
  cuda-ubuntu:
    name: CUDA (compile only, no GPU)
    runs-on: ubuntu-24.04
    container: nvidia/cuda:12.6.2-devel-ubuntu24.04
    steps:
      - uses: actions/checkout@v6

      - name: Dependencies
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          apt update
          apt install -y cmake build-essential ninja-build libgomp1 git libssl-dev

      - name: Configure + build
        run: |
          set -o pipefail
          cmake -S . -B build -G Ninja \
            ${ARIFI_CMAKE_COMMON} \
            -DGGML_CUDA=ON \
            -DCMAKE_CUDA_ARCHITECTURES=89-real \
            -DCMAKE_EXE_LINKER_FLAGS=-Wl,--allow-shlib-undefined \
            2>&1 | tee build-cuda.log
          cmake --build build --target test-quantize-fns 2>&1 | tee -a build-cuda.log

      - name: test-quantize-fns (CPU, baselined)
        shell: bash
        run: |
          set -o pipefail
          set +e
          ./build/bin/test-quantize-fns 2>&1 | tee -a build-cuda.log
          rc=${PIPESTATUS[0]}
          set -e
          # test-quantize-fns exits 1 on this fork because the ROCmFPX q2_0/q3_0/q4_0
          # absolute-error and dot-product rows fail. That is PRE-EXISTING - the rig's
          # own receipt on lane-206/upstream-b10819 reports the same six, line for line
          # (lane-evidence/2026-09-02-lane-209/r17-offrig-union/12-test-quantize-fns.txt).
          # So the gate is "exactly the known six, or none", never "exit 0": a bare
          # `| tee` would take tee's status and this step could never fail at all.
          fails=$(grep -c 'FAILED' build-cuda.log || true)
          echo "test-quantize-fns rc=$rc, FAILED rows=$fails (baseline 6)"
          if [ "$rc" -eq 0 ] && [ "$fails" -eq 0 ]; then exit 0; fi
          if [ "$rc" -eq 1 ] && [ "$fails" -eq 6 ]; then
            echo "matches the banked ROCmFPX baseline - not a regression"; exit 0
          fi
          echo "REGRESSION: expected 0 or the baselined 6 failures, got $fails (rc $rc)"
          exit 1

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: arifi-build-log-cuda
          path: build-cuda.log

  metal-macos:
    # Both library modes, deliberately. The fork carries TWO Metal sources: upstream's
    # split kernels/*.metal (401 vec kernel names, 318 of them the _q#_ne# fa_vec
    # tuning instantiations) and its own monolithic ggml-metal.metal (205 vec names,
    # ZERO _q#_ne#). CMakeLists builds the split tree into default.metallib but uses
    # the monolith for the EMBED path, so an embed build can be missing kernels the
    # dispatch asks for. embed=OFF is the union's real target; embed=ON is here to
    # SURFACE that gap rather than ship it.
    name: Metal, embed=${{ matrix.embed }} (compile only, no GPU dispatch)
    runs-on: macos-latest
    strategy:
      fail-fast: false
      matrix:
        embed: [ON, OFF]
    steps:
      - uses: actions/checkout@v6

      - name: Dependencies
        run: brew install ninja

      - name: Configure + build
        run: |
          set -o pipefail
          cmake -S . -B build -G Ninja \
            ${ARIFI_CMAKE_COMMON} \
            -DGGML_METAL=ON \
            -DGGML_METAL_EMBED_LIBRARY=${{ matrix.embed }} \
            2>&1 | tee build-metal.log
          cmake --build build --target test-quantize-fns 2>&1 | tee -a build-metal.log

      - name: test-quantize-fns (CPU, baselined)
        shell: bash
        run: |
          set -o pipefail
          set +e
          ./build/bin/test-quantize-fns 2>&1 | tee -a build-metal.log
          rc=${PIPESTATUS[0]}
          set -e
          # test-quantize-fns exits 1 on this fork because the ROCmFPX q2_0/q3_0/q4_0
          # absolute-error and dot-product rows fail. That is PRE-EXISTING - the rig's
          # own receipt on lane-206/upstream-b10819 reports the same six, line for line
          # (lane-evidence/2026-09-02-lane-209/r17-offrig-union/12-test-quantize-fns.txt).
          # So the gate is "exactly the known six, or none", never "exit 0": a bare
          # `| tee` would take tee's status and this step could never fail at all.
          fails=$(grep -c 'FAILED' build-metal.log || true)
          echo "test-quantize-fns rc=$rc, FAILED rows=$fails (baseline 6)"
          if [ "$rc" -eq 0 ] && [ "$fails" -eq 0 ]; then exit 0; fi
          if [ "$rc" -eq 1 ] && [ "$fails" -eq 6 ]; then
            echo "matches the banked ROCmFPX baseline - not a regression"; exit 0
          fi
          echo "REGRESSION: expected 0 or the baselined 6 failures, got $fails (rc $rc)"
          exit 1

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: arifi-build-log-metal-embed-${{ matrix.embed }}
          path: build-metal.log

  sycl-ubuntu:
    name: SYCL (compile only, no GPU)
    runs-on: ubuntu-24.04
    env:
      ONEAPI_ROOT: /opt/intel/oneapi/
    steps:
      - uses: actions/checkout@v6

      - name: Install oneAPI
        run: |
          cd /tmp
          wget -q https://registrationcenter-download.intel.com/akdlm/IRC_NAS/56f7923a-adb8-43f3-8b02-2b60fcac8cab/intel-deep-learning-essentials-2025.3.3.16_offline.sh -O oneapi.sh
          sudo bash oneapi.sh -s -a --silent --eula accept

      - name: Dependencies
        run: sudo apt-get update && sudo apt-get install -y ninja-build cmake libssl-dev

      - name: Configure + build
        run: |
          set -o pipefail
          source /opt/intel/oneapi/setvars.sh
          cmake -S . -B build -G Ninja \
            ${ARIFI_CMAKE_COMMON} \
            -DGGML_SYCL=ON \
            -DCMAKE_C_COMPILER=icx \
            -DCMAKE_CXX_COMPILER=icpx \
            2>&1 | tee build-sycl.log
          cmake --build build --target test-quantize-fns 2>&1 | tee -a build-sycl.log

      - name: test-quantize-fns (CPU, baselined)
        shell: bash
        run: |
          set -o pipefail
          set +e
          ./build/bin/test-quantize-fns 2>&1 | tee -a build-sycl.log
          rc=${PIPESTATUS[0]}
          set -e
          # test-quantize-fns exits 1 on this fork because the ROCmFPX q2_0/q3_0/q4_0
          # absolute-error and dot-product rows fail. That is PRE-EXISTING - the rig's
          # own receipt on lane-206/upstream-b10819 reports the same six, line for line
          # (lane-evidence/2026-09-02-lane-209/r17-offrig-union/12-test-quantize-fns.txt).
          # So the gate is "exactly the known six, or none", never "exit 0": a bare
          # `| tee` would take tee's status and this step could never fail at all.
          fails=$(grep -c 'FAILED' build-sycl.log || true)
          echo "test-quantize-fns rc=$rc, FAILED rows=$fails (baseline 6)"
          if [ "$rc" -eq 0 ] && [ "$fails" -eq 0 ]; then exit 0; fi
          if [ "$rc" -eq 1 ] && [ "$fails" -eq 6 ]; then
            echo "matches the banked ROCmFPX baseline - not a regression"; exit 0
          fi
          echo "REGRESSION: expected 0 or the baselined 6 failures, got $fails (rc $rc)"
          exit 1

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: arifi-build-log-sycl
          path: build-sycl.log

  vulkan-windows:
    name: Vulkan on Windows (the rig's own path)
    runs-on: windows-latest
    env:
      VULKAN_SDK_VERSION: 1.4.313.2
    steps:
      - uses: actions/checkout@v6

      - name: Install Vulkan SDK
        shell: pwsh
        run: |
          $ver = $env:VULKAN_SDK_VERSION
          curl.exe -o $env:RUNNER_TEMP/VulkanSDK.exe -L "https://sdk.lunarg.com/sdk/download/$ver/windows/vulkansdk-windows-X64-$ver.exe"
          & "$env:RUNNER_TEMP\VulkanSDK.exe" --accept-licenses --default-answer --confirm-command install
          "VULKAN_SDK=C:\VulkanSDK\$ver"       | Out-File -FilePath $env:GITHUB_ENV -Append
          "C:\VulkanSDK\$ver\Bin"              | Out-File -FilePath $env:GITHUB_PATH -Append

      - name: Configure + build
        shell: pwsh
        run: |
          cmake -S . -B build `
            -DCMAKE_BUILD_TYPE=Release `
            -DGGML_NATIVE=OFF `
            -DGGML_ARIFI_ROCMFPX_FORMATS=ON `
            -DGGML_ARIFI_TURBO_WEIGHT_QUANTS=ON `
            -DLLAMA_BUILD_EXAMPLES=OFF `
            -DLLAMA_BUILD_TOOLS=OFF `
            -DLLAMA_BUILD_TESTS=ON `
            -DGGML_VULKAN=ON 2>&1 | Tee-Object -FilePath build-vulkan.log
          cmake --build build --config Release --target test-quantize-fns 2>&1 | Tee-Object -FilePath build-vulkan.log -Append

      - name: test-quantize-fns (CPU, baselined)
        shell: pwsh
        run: |
          $out = & ./build/bin/Release/test-quantize-fns.exe 2>&1
          $rc = $LASTEXITCODE
          $out | Tee-Object -FilePath build-vulkan.log -Append
          # same baseline as the bash jobs: the six ROCmFPX rows are pre-existing on
          # this fork. Piping straight into Tee-Object would discard the exit code.
          $fails = ($out | Select-String -Pattern 'FAILED').Count
          Write-Output ('test-quantize-fns rc=' + $rc + ', FAILED rows=' + $fails + ' (baseline 6)')
          if ($rc -eq 0 -and $fails -eq 0) { exit 0 }
          if ($rc -eq 1 -and $fails -eq 6) { Write-Output 'matches the banked baseline'; exit 0 }
          Write-Output 'REGRESSION: expected 0 or the baselined 6 failures'
          exit 1

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: arifi-build-log-vulkan
          path: build-vulkan.log
